name: UI audit
# Captures every main screen at the top and scrolled to the bottom, and fails if text or a control ends under the tab bar or a footer.
# Separate from CI so a browser hiccup never blocks a merge; screenshots are attached to the run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**/*.css'
      - 'src/**/*.tsx'
      - 'scripts/ui-audit.mjs'

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # A fresh demo stack with fixtures and one saved sign-in (/tmp/detail-state.json), then the audit at two widths.
      - run: bash scripts/detail-up.sh
      - run: node scripts/ui-audit.mjs /tmp/ui-audit --w=390,320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-audit
          path: /tmp/ui-audit
          retention-days: 7
