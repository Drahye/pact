<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EF" />
    <title>PACT · Offline</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #f6f4ef; color: #0f1713; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      main { max-width: 320px; }
      img { width: 56px; height: 56px; }
      h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 600; }
      p { margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: #4a544f; }
      button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #0f1713; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/pact-mark-color.svg" alt="" />
      <h1>You're offline</h1>
      <p>PACT needs a connection to show your Circles and Pacts. Nothing is lost. Try again when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
